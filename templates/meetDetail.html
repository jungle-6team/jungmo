<!doctype html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모임 상세</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='output.css') }}">
</head>

<body class="min-h-screen bg-zinc-100 font-sans text-zinc-600">
    <main class="mx-auto mt-10 flex min-h-[620px] max-w-5xl overflow-hidden border border-zinc-800 bg-white">

        <!-- 왼쪽 메뉴 -->
        <aside class="flex w-60 flex-col bg-zinc-200">


            <div class="px-7 py-8">
                <p class="mb-4 text-sm font-medium text-white">{{user_id}} 님</p>

                <a href="/post" class="block rounded bg-white py-2 text-center text-sm font-semibold text-zinc-400">
                    + 글쓰기
                </a>

                <nav class="mt-8 space-y-4 text-sm font-medium">
                    <a href="/main" class="block">전체 게시글</a>
                    <a href="#" class="block text-zinc-400">참여한 게시글</a>
                </nav>
            </div>

            <div class="mt-auto p-5">
                <button class="w-full rounded bg-white py-2 text-sm font-semibold">
                    로그아웃
                </button>
            </div>
        </aside>

        <!-- 모임 상세 -->
        <section class="flex-1 px-10 py-12">
            <article class="mt-8">
                <!-- 작성자와 작성 시간 -->
                <p class="text-xs text-zinc-400">
                    ysb9912 님 <span class="mx-2">|</span> 2026.08.24 17:00
                </p>

                <!-- 제목 / 수정 / 삭제 -->
                <div class="mt-3 flex items-end justify-between border-b border-zinc-300 pb-3">
                    <h1 class="text-3xl font-bold text-zinc-700">
                        {{meet.title}}
                    </h1>

                    <div class="flex gap-3 text-sm text-zinc-500">

                        <a href="/post/update?meet_id={{ meet._id }}" lass="hover:text-zinc-800">
                            수정
                        </a>
                        <button type="button" onclick="deleteMeet('{{ meet._id }}')" class="hover:text-red-600">
                            삭제
                        </button>
                    </div>
                </div>

                <!-- 본문 -->
                <p class="min-h-28 border-b border-zinc-300 py-6 text-sm leading-7">
                    {{meet.content}}
                </p>

                <!-- 참여 영역 -->
                <div class="mx-auto mt-10 max-w-sm text-center">

                    <p class="text-sm">
                        모집 종료: {{ meet.month }}월 {{ meet.day }}일 {{ meet.time }}
                    </p>

                    <p class="text-sm">
                        현재 참여 인원
                        <span class="font-bold">{{meet.people}}명/{{meet.peopleCapacity}}명</span>
                    </p>

                    <form id="join-form">
                        <button id="join-button" type="submit"
                            class="mt-3 w-full rounded bg-zinc-400 py-3 text-sm font-semibold text-white hover:bg-zinc-500">
                            참여하기
                        </button>
                    </form>

                </div>
            </article>
        </section>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>

        $("#join-form").on("submit", function (event) {
            event.preventDefault();
            let params = new URLSearchParams(window.location.search);
            let meetId = params.get("meet_id");
            let user_id = "{{ user_id }}";
            $.ajax({
                type: "POST",
                url: "/post/join",
                data: { meet_id: meetId,
                    user_id: user_id
                },
                success: function (response) {
                    if (response["result"] === "success") {
                        alert("참여에 성공했습니다.")
                        window.location.href = "/main";
                    } else {
                        alert("참여에 실패했습니다.");
                    }
                }
            });
        });


        function deleteMeet(meetId) {
            if (!confirm("정말 삭제하시겠습니까?")) {
                return;
            }

            $.ajax({
                type: "DELETE",
                url: "/post/delete",
                data: { meet_id: meetId },

                success: function (response) {
                    if (response["result"] === "success") {
                        window.location.href = "/main";
                    } else {
                        alert(response["msg"]);
                    }
                }
            });
        }
    </script>
</body>

</html>
