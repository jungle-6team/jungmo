<!doctype html>

<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="http://code.jquery.com/jquery-3.5.1.min.js"></script>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='output.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='login.css') }}"
    />
    <title>정모:정글모임</title>
  </head>
  <body class="flex min-h-screen flex-col items-center justify-center">
    <img src="{{ url_for('static', filename='logo.svg') }}" />
    <p class="my-6 text-2xl font-bold">로그인</p>

    <form name="inform" action="#" method="POST" class="w-full max-w-md">
      <div class="mb-4">
        <label for="login_id" class="mb-2 block"> 아이디 </label>
        <input
          id="userid"
          type="text"
          name="login_id"
          required
          class="w-full rounded-sm border border-green-700 px-6 py-3"
          placeholder="아이디를 입력하세요"
        />
      </div>

      <div class="mb-4">
        <label for="password" class="mb-2 block">비밀번호</label>
        <input
          id="userpw"
          type="password"
          name="login_pw"
          class="w-full rounded-sm border border-green-700 px-6 py-3"
          placeholder="비밀번호를 입력하세요"
        />
      </div>
      <div class="mb-4">
        <button
          id="login_attempt"
          type="button"
          onclick="loginAttempt()"
          class="w-full rounded-sm bg-green-600 py-3 text-white"
        >
          로그인
        </button>
      </div>
      <div class="mb-4 flex justify-center space-x-3">
        <p class="text-sm text-gray-400">계정이 없으신가요?</p>
        <a
          href="{{ url_for('signup') }}"
          class="text-sm font-semibold text-gray-400 underline"
          >회원가입</a
        >
      </div>
    </form>

    <!-- <p class="mt-10 text-center text-sm/6 text-gray-500">
                Not a member?
                <a href="#" class="font-semibold text-indigo-600 hover:text-indigo-500">Start a 14 day free trial</a> -->
    <script>
      function loginAttempt() {
        // id_give = $('#login_id').val();
        // pw_give = $('#login_pw').val();

        $.ajax({
          type: "POST",
          url: "/api/login",
          data: {
            id_give: $("#userid").val(),
            pw_give: $("#userpw").val(),
          },
          success: function (response) {
            if (response["result"] == "success") {
              alert("로그인 되었습니다.");
              window.location.href = "/main";
              // window.location.href = "/link"
            } else {
              alert("로그인 실패!");
            }
          },
        });
      }
    </script>
  </body>
</html>
